services:
  mongodb:
    image: mongo:7
    container_name: nave-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: nave-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  mongo_data:
